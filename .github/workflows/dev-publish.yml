name: Build and publish dev branch image

# Every push to a feature branch builds an image tagged `dev-<slug>`, where the
# slug is the branch name flattened to what a docker tag allows
# (fix/mermaid-parsing -> dev-fix-mermaid-parsing).
#
# The server runs a rolling window of DEV_SLOTS containers, each pinned to one
# of those tags (see dev/docker-compose.yml on the host). Pushing to a branch
# that currently holds a slot redeploys it within ~60s via watchtower; pushing
# to a branch that does not moves it to the front of the queue for the next
# slot that frees up.
#
# `latest`/`prod`, `stage` and `dev-*` are disjoint by construction: this
# workflow never runs on main or staging, and neither of the other publish
# workflows writes a dev-* tag. No watchtower can see another environment's build.
on:
  push:
    branches-ignore: [main, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Unlike the prod and staging publishes, superseded dev builds are cancelled:
# nothing depends on a dev image existing for every intermediate commit, and the
# slot only ever shows the tip of the branch anyway.
concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive branch slug
        id: slug
        run: |
          set -euo pipefail
          # Must stay byte-identical to slugify() in scripts/dev-slots.sh on the
          # deploy host, or the host will look for a tag this never pushed.
          slug=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-._]+//; s/[-._]+$//' \
            | cut -c1-100)
          echo "slug=${slug}" >>"$GITHUB_OUTPUT"
          echo "Branch ${GITHUB_REF_NAME} -> tag dev-${slug}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The moving tag is what a slot is pinned to; the -<sha> tag exists so
          # a slot can be held on one specific build while you bisect something.
          tags: |
            type=raw,value=dev-${{ steps.slug.outputs.slug }}
            type=raw,value=dev-${{ steps.slug.outputs.slug }}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Warm from this branch's own cache, falling back to main's for a
          # branch that has never built. mode=min on the write: a dozen active
          # branches each writing a full mode=max cache would blow through the
          # repo's 10GB Actions cache budget and start evicting main's.
          cache-from: |
            type=gha,scope=dev-${{ steps.slug.outputs.slug }}
            type=gha
          cache-to: type=gha,mode=min,scope=dev-${{ steps.slug.outputs.slug }}
