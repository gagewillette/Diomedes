name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Two pushes to main must not race to bump the version, so publishes are
# serialised rather than cancelled — every commit still gets its own image.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Belt-and-suspenders: staging -> main should already be behind the ci.yml
  # required check via branch protection, but a tag push or an admin merge
  # bypasses that, so re-run the suite before anything ships as a release.
  test:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/tests.yml

  # Bumps the version and pushes the bump commit + tags back to main. Only runs
  # for pushes to main; a manual `v*` tag push skips straight to the build.
  #
  # This lives in the same workflow as the build on purpose: a push made with
  # GITHUB_TOKEN deliberately does not trigger workflows, so a separate bump
  # workflow would never kick off the build. Same reason there is no risk of an
  # infinite loop here.
  version:
    needs: [test]
    if: always() && !failure() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      release_version: ${{ steps.bump.outputs.release_version }}
      release_minor: ${{ steps.tag.outputs.release_minor }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags — the bump range is measured from the most
          # recent v* tag, not from the previous push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out and apply the bump
        id: bump
        run: ./scripts/bump-version.sh --apply

      - name: Commit, tag and push
        id: tag
        if: steps.bump.outputs.bumped == 'true'
        env:
          RELEASE: ${{ steps.bump.outputs.release_version }}
          SERVER: ${{ steps.bump.outputs.server_version }}
          CLIENT: ${{ steps.bump.outputs.client_version }}
          SERVER_BUMPED: ${{ steps.bump.outputs.server_bumped }}
          CLIENT_BUMPED: ${{ steps.bump.outputs.client_bumped }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json \
                  server/package.json server/package-lock.json \
                  client/package.json client/package-lock.json
          git commit -m "Release ${RELEASE} (server ${SERVER}, client ${CLIENT})"

          # The release tag drives the image version. The component tags exist so
          # you can point at "the commit where the client became 1.4.0" even
          # though the two component versions drift apart.
          tags=("v${RELEASE}")
          git tag -a "v${RELEASE}" -m "Diomedes ${RELEASE}"
          if [[ "$SERVER_BUMPED" == "true" ]]; then
            git tag -a "server-v${SERVER}" -m "server ${SERVER}"
            tags+=("server-v${SERVER}")
          fi
          if [[ "$CLIENT_BUMPED" == "true" ]]; then
            git tag -a "client-v${CLIENT}" -m "client ${CLIENT}"
            tags+=("client-v${CLIENT}")
          fi

          # Commit and tags go up together: if the push is rejected because main
          # moved, the run fails and the next push redoes the bump from the last
          # release tag, so nothing is lost.
          git push origin HEAD:main "${tags[@]}"

          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "release_minor=${RELEASE%.*}" >>"$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    # Still build for `v*` tag pushes and manual runs, where `test`/`version`
    # are skipped rather than failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the bump commit, not the commit that triggered the run.
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest`/`prod` and `stage` are disjoint by construction: this
          # workflow only fires on pushes to main (or a v* tag), and
          # staging-publish.yml is the only thing that ever writes the
          # `stage` tag, on pushes to the staging branch. Neither workflow
          # writes the other's tag, so watchtower on each host only ever sees
          # updates for the tag its compose file is pinned to. `prod` is an
          # explicit alias for `latest` so a compose file can pin to it
          # without relying on `latest`'s implicit meaning.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.release_version }},enable=${{ needs.version.outputs.bumped == 'true' }}
            type=raw,value=${{ needs.version.outputs.release_minor }},enable=${{ needs.version.outputs.bumped == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
