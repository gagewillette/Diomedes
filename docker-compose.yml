services:
  diomedes:
    image: diomedes:${DIOMEDES_VERSION:-latest}
    build: .
    container_name: diomedes
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
      STORAGE_PATH: /app/data/storage
    ports:
      - "3000:3000"
    volumes:
      - /mnt/storage/diomedes/app-data:/app/data/storage

  db:
    image: postgres:16-alpine
    container_name: diomedes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/storage/diomedes/db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: diomedes-redis
    restart: unless-stopped
    volumes:
      - /mnt/storage/diomedes/redis:/data
