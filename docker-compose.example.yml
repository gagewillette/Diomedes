# Reference deployment for Diomedes. Copy to docker-compose.yml (gitignored) and
# adjust the volumes to suit your host, then `cp .env.example .env` and fill it in.
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# The app image is pulled from GHCR — you do not need to build anything locally.
# Watchtower polls every minute and restarts the app when a new image is
# published. Postgres and Redis are pinned to exact patch versions and are left
# alone by watchtower; upgrade them deliberately.
#
# DIOMEDES_VERSION only ever resolves to a prod tag (latest/prod/a semver) —
# docker-publish.yml is the only workflow that writes those, on push to main.
# It never writes `staging`, so this container can never pick up a staging
# build. The staging stack (docker-compose.staging.yml) is pinned to the
# `staging` tag instead, which only staging-publish.yml writes.

services:
  diomedes:
    image: ghcr.io/gagewillette/diomedes:${DIOMEDES_VERSION:-latest}
    container_name: diomedes
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # required:false so the app still starts when the "ollama" profile is off
      # and the service does not exist. When it is on, the app waits for the
      # embedding model to finish downloading.
      ollama:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
      STORAGE_PATH: /app/data/storage
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data/storage
    labels:
      # Opt this container in to watchtower's auto-update.
      com.centurylinklabs.watchtower.enable: "true"

  db:
    # pgvector's image is postgres 16 plus the vector extension — a drop-in
    # replacement that reuses an existing postgres:16 data volume. Required only
    # if you turn SEMANTIC_SEARCH_ENABLED on; plain postgres:16 also works and
    # search simply stays full-text.
    image: pgvector/pgvector:pg16
    container_name: diomedes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  redis:
    image: redis:7.4.10-alpine
    container_name: diomedes-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  # Embedding server for semantic search. Enabled by the "ollama" compose
  # profile (see COMPOSE_PROFILES in .env) — with the profile off this service
  # is not created at all and search stays pure full-text.
  #
  # Nothing is installed on the host: the container starts the server, pulls
  # ${EMBEDDING_MODEL} into the ollama-models volume on first run, and only
  # reports healthy once that model is on disk. Later starts find the model in
  # the volume and come up immediately, offline included. The model is pinned
  # by that volume on purpose — re-embedding the corpus against a different
  # model is a deliberate act, so upgrade with:
  #   docker compose exec ollama ollama pull <model>
  ollama:
    image: ollama/ollama:0.32.14
    container_name: diomedes-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      # Keep the model resident between searches; the default 5m means a cold
      # reload on every quiet stretch.
      OLLAMA_KEEP_ALIVE: 60m
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /bin/ollama serve &
        pid=$$!
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        if /bin/ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1; then
          echo "ollama: $$EMBEDDING_MODEL already present"
        else
          echo "ollama: pulling $$EMBEDDING_MODEL — first run only, a few hundred MB"
          until /bin/ollama pull "$$EMBEDDING_MODEL"; do
            echo "ollama: pull failed, retrying in 10s"
            sleep 10
          done
        fi
        touch /tmp/model-ready
        wait $$pid
    healthcheck:
      # Unhealthy until the model exists, so the app never embeds against a
      # model that is still downloading — those jobs would land as 'failed'.
      test: ["CMD-SHELL", "test -f /tmp/model-ready && ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Generous: the whole first pull happens inside this window.
      start_period: 15m
    # NVIDIA host? Install the container toolkit and uncomment to use the GPU.
    # CPU is fine for nomic-embed-text — roughly 50ms per chunk.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  # --label-enable means watchtower only touches containers that explicitly opt
  # in above, so any unrelated stacks on the same host are untouched. Drop this
  # service if you would rather deploy by hand with `docker compose pull`.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: diomedes-watchtower
    restart: unless-stopped
    environment:
      # watchtower defaults to Docker API 1.25, which modern daemons reject.
      DOCKER_API_VERSION: "1.41"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only needed if the image is private — see README.
      # - ~/.docker/config.json:/config.json:ro
    command: --interval 60 --label-enable --cleanup
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  app-data:
  db-data:
  redis-data:
  # Downloaded embedding models. Survives container replacement, so the pull
  # happens once for the life of the host.
  ollama-models:
