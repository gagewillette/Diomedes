# Local dev dependencies only — Postgres + Redis for running server/client
# directly on the host with `npm run dev`. Not used for deployment; see
# docker-compose.example.yml for that.
#
#   npm run dev        # starts these, then server (:3000) + client (:5173)
#   npm run dev:down   # stops them

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: diomedes-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: diomedes
      POSTGRES_USER: diomedes
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diomedes -d diomedes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.10-alpine
    container_name: diomedes-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Embedding server for semantic search, started by scripts/dev.sh only when
  # SEMANTIC_SEARCH_ENABLED=true and no OPENAI_API_KEY is set. Pulls its own
  # model on first run into ./data/ollama — no host install, nothing to pull by
  # hand. First start blocks until the download finishes; later starts are
  # instant. Upgrade the model deliberately:
  #   docker compose -f docker-compose.dev.yml exec ollama ollama pull <model>
  ollama:
    image: ollama/ollama:0.32.14
    container_name: diomedes-dev-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: 60m
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /bin/ollama serve &
        pid=$$!
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        if /bin/ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1; then
          echo "ollama: $$EMBEDDING_MODEL already present"
        else
          echo "ollama: pulling $$EMBEDDING_MODEL — first run only, a few hundred MB"
          until /bin/ollama pull "$$EMBEDDING_MODEL"; do
            echo "ollama: pull failed, retrying in 10s"
            sleep 10
          done
        fi
        touch /tmp/model-ready
        wait $$pid
    healthcheck:
      # Unhealthy until the model is on disk — `up --wait` in dev.sh therefore
      # blocks until embeddings can actually be served.
      test: ["CMD-SHELL", "test -f /tmp/model-ready && ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15m
